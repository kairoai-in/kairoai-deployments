apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kairoai-prod
  namespace: argocd
spec:
  description: KairoAI production applications
  sourceRepos:
    - https://github.com/kairoai-in/kairoai-deployments.git
  destinations:
    - namespace: kairoai
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
