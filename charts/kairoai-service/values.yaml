replicaCount: 1

image:
  repository: kairoai.azurecr.io/kairoai-api-gateway
  tag: latest
  pullPolicy: IfNotPresent

command: []
args: []

service:
  enabled: true
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
  tls: []

env:
  ENVIRONMENT: dev
  LOG_LEVEL: INFO

secretEnv: {}

envFrom: []

probes:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

resources: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

networkPolicy:
  enabled: false
  ingress:
    from: []
    ports: []
  egress:
    enabled: false
    to: []
    ports: []
