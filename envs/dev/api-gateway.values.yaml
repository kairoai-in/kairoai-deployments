fullnameOverride: kairoai-api-gateway
image:
  repository: acrkairoaidev.azurecr.io/kairoai-api-gateway
  tag: aaa0ab5
  pullPolicy: Always
env:
  ENVIRONMENT: dev
  LOG_LEVEL: INFO
  REVIEW_ORCHESTRATOR_URL: http://kairoai-review-orchestrator:8000
secretEnv:
  GITHUB_WEBHOOK_SECRET:
    name: kairoai-runtime-secrets
    key: github-webhook-secret
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.kairoai.in
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kairoai-api-gateway-tls
      hosts:
        - api.kairoai.in
